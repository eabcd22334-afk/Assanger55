<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সিক্রেট রিয়েল-টাইম চ্যাট</title>
    <!-- Tailwind CSS ও DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col justify-center items-center">

    <!-- পিন পেজ -->
    <div id="pin-section" class="card w-96 bg-slate-800 shadow-xl p-6 border border-slate-700">
        <h2 class="text-2xl font-bold text-center mb-4 text-emerald-400">সিক্রেট চ্যাট</h2>
        <p class="text-sm text-slate-400 text-center mb-6">প্রবেশ করতে গোপন পিন কোড দিন</p>
        <input type="password" id="pin-input" placeholder="****" class="input input-bordered w-full bg-slate-900 border-slate-700 mb-4 text-center tracking-widest text-lg" maxlength="4" />
        <button onclick="verifyPin()" class="btn bg-emerald-600 hover:bg-emerald-500 text-white w-full">প্রবেশ করুন</button>
        <p id="pin-error" class="text-red-400 text-xs text-center mt-3 hidden">ভুল পিন!</p>
    </div>

    <!-- নাম সেটআপ পেজ -->
    <div id="name-section" class="card w-96 bg-slate-800 shadow-xl p-6 border border-slate-700 hidden">
        <h2 class="text-2xl font-bold text-center mb-4 text-emerald-400">আপনার পরিচয় দিন</h2>
        <input type="text" id="username-input" placeholder="আপনার নাম লিখুন..." class="input input-bordered w-full bg-slate-900 border-slate-700 mb-4" />
        <button onclick="setUserName()" class="btn bg-emerald-600 hover:bg-emerald-500 text-white w-full">চ্যাট শুরু করুন</button>
    </div>

    <!-- চ্যাট রুম পেজ -->
    <div id="chat-section" class="w-full max-w-2xl h-[90vh] bg-slate-800 rounded-xl shadow-2xl flex flex-col border border-slate-700 hidden">
        <div class="p-4 bg-slate-900 border-b border-slate-700 flex justify-between items-center rounded-t-xl">
            <h3 class="font-bold text-lg text-emerald-400">পাবলিক চ্যাট রুম</h3>
            <span id="current-user-display" class="badge badge-outline border-emerald-500 text-emerald-400"></span>
        </div>
        <div id="message-container" class="flex-1 p-4 overflow-y-auto space-y-4 flex flex-col"></div>
        <form id="chat-form" onsubmit="sendMessage(event)" class="p-4 bg-slate-900 border-t border-slate-700 flex gap-2 rounded-b-xl">
            <input type="text" id="message-input" placeholder="মেসেজ লিখুন..." class="input input-bordered flex-1 bg-slate-800 border-slate-700" autocomplete="off" required />
            <button type="submit" class="btn bg-emerald-600 hover:bg-emerald-500 text-white">পাঠান</button>
        </form>
    </div>

    <!-- ফায়ারবেস স্ক্রিপ্ট ও লজিক -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // আপনার ফায়ারবেস প্রজেক্ট কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyC8aJlXFdYdGqDkAF3RPGdSxR6RLGXd0Bs",
            authDomain: "assanger-51e65.firebaseapp.com",
            databaseURL: "https://assanger-51e65-default-rtdb.firebaseio.com",
            projectId: "assanger-51e65",
            storageBucket: "assanger-51e65.appspot.com",
            messagingSenderId: "887503433353",
            appId: "1:887503433353:web:8255955b0d958ea88e2058"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        let myUserName = "";

        window.verifyPin = function() {
            const pin = document.getElementById('pin-input').value;
            if (pin === "1000") {
                document.getElementById('pin-section').classList.add('hidden');
                document.getElementById('name-section').classList.remove('hidden');
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        }

        window.setUserName = function() {
            const name = document.getElementById('username-input').value.trim();
            if (!name) return alert('দয়া করে নাম লিখুন!');
            myUserName = name;
            document.getElementById('current-user-display').innerText = `নাম: ${myUserName}`;
            document.getElementById('name-section').classList.add('hidden');
            document.getElementById('chat-section').classList.remove('hidden');
            document.getElementById('chat-section').classList.add('flex');
            loadMessages();
        }

        window.sendMessage = function(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            if (!input.value.trim()) return;

            push(messagesRef, {
                sender: myUserName,
                text: input.value,
                timestamp: Date.now()
            });
            input.value = '';
        }

        function loadMessages() {
            const container = document.getElementById('message-container');
            onChildAdded(messagesRef, (snapshot) => {
                const data = snapshot.val();
                const isMe = data.sender === myUserName;

                const div = document.createElement('div');
                div.className = `chat ${isMe ? 'chat-end' : 'chat-start'}`;
                div.innerHTML = `
                    <div class="chat-header text-xs text-slate-400 mb-1">${data.sender}</div>
                    <div class="chat-bubble ${isMe ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-100'}">${data.text}</div>
                `;
                container.appendChild(div);
                container.scrollTop = container.scrollHeight;
            });
        }
    </script>
</body>
</html>
